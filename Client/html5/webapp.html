<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PKTB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <button id="hamburger-btn" class="hamburger-btn" aria-label="Open menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Fetched from html/sidebar.html by app.js and injected here -->
  <div id="sidebar-include"></div>

  <div class="app-container">

    <header class="app-header">
      <h1>PKTB</h1>
      <p class="app-subtitle">Build and rate your dream team</p>
    </header>

    <section class="search-section">
      <div class="search-box">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search a Pokémon"
          autocomplete="off"
        >
        <button id="search-clear-btn" class="search-clear-btn" aria-label="Clear search" hidden>&times;</button>
        <div id="suggestions" class="suggestions" hidden>
          <!-- suggestion items get inserted here by app.js -->
        </div>
      </div>
    </section>

    <section class="random-suggestions-section">
      <div class="random-suggestions-header">
        <p class="random-suggestions-label">Try one of these for your team!</p>
        <button id="shuffle-btn" class="shuffle-btn" aria-label="Shuffle suggestions">S</button>
      </div>
      <div id="random-suggestions" class="random-suggestions-grid">
        <!-- 6 random suggestion cards inserted by app.js, e.g.:
        <button class="suggestion-card" data-pokemon-id="25">
          <img src="..." alt="">
          <span>Pikachu</span>
        </button>
        -->
      </div>
    </section>

    <section class="roster-section">
      <div class="roster-header">
        <h2>Your team</h2>
        <div class="roster-header-actions">
          <span id="roster-count" class="roster-count">0 / 6</span>
          <button id="clear-team-btn" class="clear-team-btn">Clear team</button>
        </div>
      </div>

      <div id="roster-grid" class="roster-grid">
        <!-- roster nodes get inserted here by app.js, e.g.:
        <div class="roster-slot" data-pokemon-id="25">
          <button class="roster-remove-btn" aria-label="Remove Pikachu">&times;</button>
          <img src="..." alt="">
          <span class="roster-name">Pikachu</span>
        </div>
        -->
      </div>

      <button id="rate-team-btn" class="rate-team-btn" disabled>
        Rate my team
      </button>
    </section>

  </div>

  <!-- Fetched from html/footer.html by app.js and injected here -->
  <div id="footer-include"></div>

  <!-- Evaluation lightbox: sits outside .app-container, hidden until a team is evaluated -->
  <div id="lightbox" class="lightbox">
    <div class="lightbox-panel">

      <div class="lightbox-header">
        <div class="lightbox-tabs">
          <button class="tab-btn is-active" data-tab="matchups">Team matchups</button>
          <button class="tab-btn" data-tab="personality">Trainer type</button>
        </div>
        <div class="lightbox-header-actions">
          <button id="save-rating-btn" class="save-rating-btn">Save rating</button>
          <button id="lightbox-close" class="lightbox-close" aria-label="Close">&times;</button>
        </div>
      </div>

      <div id="tab-matchups" class="tab-panel is-active">
        <p class="lightbox-hint">Tap a Pokémon for its individual matchup breakdown.</p>
        <div id="matchup-roster" class="matchup-roster">
          <!-- clickable roster icons inserted by app.js -->
        </div>
        <div id="matchup-detail" class="matchup-detail">
          <!-- typing summary / per-pokemon detail inserted by app.js -->
        </div>
      </div>

      <div id="tab-personality" class="tab-panel">
        <div id="personality-detail" class="personality-detail">
          <!-- trainer personality result inserted by app.js -->
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
